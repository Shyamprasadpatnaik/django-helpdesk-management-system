{% extends "base.html" %}

{% block title %}System Error - JK Paper Mill{% endblock %}

{% block content %}
<div class="card-box" style="text-align: center; padding: 60px 20px; max-width: 600px; margin: 40px auto;">
    <div style="font-size: 64px; color: var(--danger); margin-bottom: 16px;">
        <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">500 - Internal Server Error</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">
        An unexpected technical error occurred. This incident has been recorded in the platform audit logs.
    </p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary">
        <i class="bi bi-arrow-clockwise"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
