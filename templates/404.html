{% extends "base.html" %}

{% block title %}Page Not Found - JK Paper Mill{% endblock %}

{% block content %}
<div class="card-box" style="text-align: center; padding: 60px 20px; max-width: 600px; margin: 40px auto;">
    <div style="font-size: 64px; color: var(--primary); margin-bottom: 16px;">
        <i class="bi bi-question-diamond-fill"></i>
    </div>
    <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">404 - Page Not Found</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">
        The ticket, department, or administrative page you requested does not exist or has been moved.
    </p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary">
        <i class="bi bi-arrow-left"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
